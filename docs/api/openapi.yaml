openapi: 3.0.3
info:
  title: Finisher Legacy API
  version: "1.0"
  description: >
    Fase 1 del contrato /api/v1 — cubre solo las rutas realmente
    implementadas (ver routes/api.php). No es una spec aspiracional:
    cualquier endpoint documentado aquí existe y está probado. El Device
    API completo vive documentado aparte en docs/device-api/v1.md y no se
    repite en detalle aquí.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Event Ops
  - name: Integrations
  - name: Health
  - name: Device
  - name: Store
  - name: Legacy Plate
  - name: Gear
  - name: Me

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness check público
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  api_version: { type: string, example: "1.0" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Emite un token de usuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: "#/components/schemas/User" }
                      token: { type: string }
        "422":
          description: Credenciales inválidas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /me:
    get:
      tags: [Auth]
      summary: Usuario autenticado — permisos y atleta vinculado
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/User" }
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /events:
    post:
      tags: [Event Ops]
      summary: Creación manual de evento (Event + EventEdition + EventRace[]) — requiere events.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sport_id, edition_name, year, event_date, city, country, races]
              properties:
                name: { type: string }
                sport_id: { type: integer }
                organizer_id: { type: integer, nullable: true }
                edition_name: { type: string }
                year: { type: integer }
                event_date: { type: string, format: date }
                city: { type: string }
                country: { type: string }
                data_source_type: { type: string, enum: [manual, file, api], nullable: true }
                races:
                  type: array
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string }
                      distance_value: { type: number, nullable: true }
                      distance_unit: { type: string, nullable: true }
      responses:
        "201":
          description: Evento creado
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/organizers/{organizer}/data-source:
    get:
      tags: [Integrations]
      summary: Ver la fuente de datos por defecto de un Organizer — requiere eventdata.manage
      parameters:
        - name: organizer
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
    put:
      tags: [Integrations]
      summary: Establecer la fuente de datos de un Organizer — requiere eventdata.manage
      parameters:
        - name: organizer
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [manual, file, api] }
                provider_connection_id: { type: integer, nullable: true }
                active: { type: boolean }
      responses:
        "200":
          description: OK

  /admin/provider-connections/{providerConnection}/test:
    post:
      tags: [Integrations]
      summary: Probar una ProviderConnection — requiere integrations.sync, nunca devuelve secretos
      parameters:
        - name: providerConnection
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK

  /admin/incidents/{incident}/resolve:
    post:
      tags: [Event Ops]
      summary: Resolver una incidencia — requiere incidents.manage, exige resolution_type
      parameters:
        - name: incident
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution_type]
              properties:
                resolution_type: { type: string, enum: [fixed, reprinted, refunded, no_action_needed, escalated, other] }
                notes: { type: string, nullable: true }
      responses:
        "200":
          description: OK
        "409":
          description: Ya estaba resuelta

  /event-ops/{eventEdition}:
    get:
      tags: [Event Ops]
      summary: Dashboard operativo del evento
      parameters:
        - $ref: "#/components/parameters/EventEditionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/EventOpsDashboard" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /event-ops/{eventEdition}/participants/search:
    get:
      tags: [Event Ops]
      summary: Buscar participante por dorsal o nombre
      parameters:
        - $ref: "#/components/parameters/EventEditionId"
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK — hasta 20 resultados, prioridad dorsal exacto > prefijo > id externo > nombre
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ParticipantSummary" }

  /event-ops/participants/{eventParticipant}:
    get:
      tags: [Event Ops]
      summary: Detalle de participante — resultado, splits, elegibilidad
      parameters:
        - $ref: "#/components/parameters/EventParticipantId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ParticipantDetail" }
        "404":
          $ref: "#/components/responses/NotFound"

  /event-ops/participants/{eventParticipant}/plate:
    post:
      tags: [Event Ops]
      summary: Generar placa integrada
      parameters:
        - $ref: "#/components/parameters/EventParticipantId"
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      responses:
        "201":
          description: Placa creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Plate" }
        "409":
          description: Ya existe una placa para este participante
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: El evento no tiene molde asignado (PLATE_TEMPLATE_MISSING)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /integrations/mappings/{eventMapping}/sync:
    post:
      tags: [Integrations]
      summary: Encolar una sincronización con el proveedor externo
      parameters:
        - name: eventMapping
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sync_type: { type: string, enum: [roster, results, full] }
                full: { type: boolean }
      responses:
        "202":
          description: Encolado — no se ejecuta en este request
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      mapping_id: { type: integer }

  /integrations/mappings/{eventMapping}/sync-runs/latest:
    get:
      tags: [Integrations]
      summary: Última corrida de sincronización de este mapping
      parameters:
        - name: eventMapping
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/SyncRun" }
        "404":
          description: Todavía no hay ninguna sincronización
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /device/bootstrap:
    get:
      tags: [Device]
      summary: Payload de arranque para una estación (Device API — ver docs/device-api/v1.md)
      security:
        - deviceBearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      device: { $ref: "#/components/schemas/Device" }
                      current_job:
                        type: object
                        nullable: true
                        properties:
                          id: { type: integer }
                          status: { type: string }
                          next_action: { type: string, nullable: true }
                      server_time: { type: string, format: date-time }
                      api_version: { type: string }
                      minimum_supported_client_version: { type: string, nullable: true }

  /store/products:
    get:
      tags: [Store]
      summary: Catálogo público — solo productos activos
      security: []
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [legacy_plate, apparel, accessory, equipment] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ProductSummary" }

  /store/products/{slug}:
    get:
      tags: [Store]
      summary: Detalle de producto + variantes activas
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ProductDetail" }
        "404":
          $ref: "#/components/responses/NotFound"

  /cart:
    get:
      tags: [Store]
      summary: Carrito del usuario autenticado
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Cart" }
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /cart/items:
    post:
      tags: [Store]
      summary: Agregar una línea al carrito
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_variant_id, quantity]
              properties:
                product_variant_id: { type: integer }
                quantity: { type: integer, minimum: 1 }
                event_edition_id: { type: integer, nullable: true }
                legacy_plate_model_id: { type: integer, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Cart" }
        "422":
          description: Sin stock suficiente u otro error de validación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /cart/coupon:
    post:
      tags: [Store]
      summary: Aplica un cupón al carrito — validación de UX únicamente, CheckoutCart siempre revalida
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Cart" }
        "422":
          description: COUPON_NOT_APPLICABLE — ver details.reason
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Store]
      summary: Quita el cupón del carrito
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Cart" }

  /checkout:
    post:
      tags: [Store]
      summary: Convierte el carrito en una Order — precio/stock siempre recalculados server-side
      responses:
        "201":
          description: Order creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "422":
          description: PRODUCT_OUT_OF_STOCK / PRICE_NOT_AVAILABLE / ATHLETE_REQUIRED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders:
    get:
      tags: [Store]
      summary: Pedidos del usuario autenticado
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }

  /orders/{uuid}:
    get:
      tags: [Store]
      summary: Detalle de una Order propia
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/Order" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{uuid}/payments/online:
    post:
      tags: [Store]
      summary: Inicia un pago con gateway online (Stripe) — monto siempre del servidor
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: OK — client_payload sin secretos
        "501":
          description: Gateway no configurado todavía (ver docs/architecture/commerce.md)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/orders/{uuid}/payments/manual:
    post:
      tags: [Store]
      summary: Registrar pago manual (efectivo/terminal) — requiere payments.record_manual
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, amount_minor]
              properties:
                method: { type: string, enum: [cash, mercado_pago_terminal] }
                amount_minor: { type: integer }
                reference: { type: string, nullable: true }
                notes: { type: string, nullable: true }
      responses:
        "201":
          description: Pago registrado
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: PAYMENT_ALREADY_RECORDED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /legacy-plate-models:
    get:
      tags: [Legacy Plate]
      summary: Modelos de Legacy Plate activos — público, campos app-safe
      security: []
      responses:
        "200":
          description: OK

  /gear/{code}:
    get:
      tags: [Gear]
      summary: Lookup público de un producto por asset_code — nunca PII del dueño
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"

  /me/gear:
    get:
      tags: [Gear]
      summary: Digital Closet del Athlete autenticado
      responses:
        "200":
          description: OK

  /gear/{code}/claim:
    post:
      tags: [Gear]
      summary: Reclamar un producto sin dueño — idempotente vía Cache::lock + lockForUpdate
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reclamado
        "409":
          description: ASSET_ALREADY_CLAIMED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /me/profile:
    get:
      tags: [Me]
      summary: Perfil del usuario autenticado — mismo ProfileController que la sesión web
      responses:
        "200":
          description: OK
    patch:
      tags: [Me]
      summary: Actualiza el perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
      responses:
        "200":
          description: OK
        "422":
          description: Error de validación
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }

  /me/events:
    get:
      tags: [Me]
      summary: Historial del Athlete — misma Query que el admin (GetAthleteHistory)
      responses:
        "200":
          description: OK

  /me/events/{participant}:
    get:
      tags: [Me]
      summary: Detalle de una participación propia
      parameters:
        - name: participant
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
        "403":
          $ref: "#/components/responses/Forbidden"

  /me/events/{participant}/gear:
    get:
      tags: [Me]
      summary: Equipo asociado a esta participación (EventGearSelection)
      parameters:
        - name: participant
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
    post:
      tags: [Me]
      summary: Asocia un producto propio (AthleteOwnedProduct) a esta participación
      parameters:
        - name: participant
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [athlete_owned_product_id]
              properties:
                athlete_owned_product_id: { type: integer }
      responses:
        "201":
          description: Asociado
        "409":
          description: EVENT_GEAR_ALREADY_ASSIGNED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /me/events/{participant}/gear/{gear}:
    delete:
      tags: [Me]
      summary: Quita un producto asociado a esta participación
      parameters:
        - name: participant
          in: path
          required: true
          schema: { type: integer }
        - name: gear
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK

  /me/events/{participant}/media:
    get:
      tags: [Me]
      summary: Media de una participación
      parameters:
        - name: participant
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
    post:
      tags: [Me]
      summary: Subir foto/video — límites en config('finisher.event_media')
      parameters:
        - name: participant
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                is_public: { type: boolean }
      responses:
        "201":
          description: Subido
        "422":
          description: MEDIA_LIMIT_REACHED / MEDIA_TOO_LARGE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /me/history:
    get:
      tags: [Me]
      summary: Alias filtrable de /me/events (mismo MeEventsController::index) — mismos filtros from/to/event_id
      responses:
        "200":
          description: OK

  /me/notifications:
    get:
      tags: [Me]
      summary: Notificaciones del usuario autenticado (paginado)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string, nullable: true }
                        message: { type: string, nullable: true }
                        type: { type: string, nullable: true }
                        action_url: { type: string, nullable: true }
                        read_at: { type: string, format: date-time, nullable: true }
                        created_at: { type: string, format: date-time }

  /me/notifications/{notification}/read:
    post:
      tags: [Me]
      summary: Marca una notificación propia como leída
      parameters:
        - name: notification
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
        "404":
          $ref: "#/components/responses/NotFound"

  /me/notifications/read-all:
    post:
      tags: [Me]
      summary: Marca todas las notificaciones propias como leídas
      responses:
        "200":
          description: OK

  /me/support-sessions:
    get:
      tags: [Me]
      summary: Sesiones de apoyo del Athlete autenticado (paginado, 20/página)
      responses:
        "200":
          description: OK
    post:
      tags: [Me]
      summary: Crea una sesión de apoyo ("Mi equipo de apoyo")
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 150 }
                event_participant_id: { type: integer, nullable: true }
                target_distance_meters: { type: integer, nullable: true }
      responses:
        "201":
          description: Creada

  /me/support-sessions/{supportSession}:
    get:
      tags: [Me]
      summary: Detalle de una sesión propia, con sus mensajes
      parameters:
        - name: supportSession
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
        "403":
          $ref: "#/components/responses/Forbidden"

  /me/support-sessions/{supportSession}/manifest:
    get:
      tags: [Me]
      summary: Payload de configuración para el polling del cliente — nunca expone el contenido de una sorpresa antes de su disparo
      parameters:
        - name: supportSession
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK

  /me/support-sessions/{supportSession}/triggered:
    get:
      tags: [Me]
      summary: Mensajes ya disparados según distance_meters
      parameters:
        - name: supportSession
          in: path
          required: true
          schema: { type: integer }
        - name: distance_meters
          in: query
          required: true
          schema: { type: integer }
        - name: consumed_ids
          in: query
          schema: { type: array, items: { type: integer } }
      responses:
        "200":
          description: OK

  /me/support-messages/{message}/consumed:
    post:
      tags: [Me]
      summary: Marca un mensaje de apoyo como consumido
      parameters:
        - name: message
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK

  /me/push-devices:
    post:
      tags: [Me]
      summary: Registra/actualiza un dispositivo push — token cifrado en reposo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, provider, token]
              properties:
                platform: { type: string, enum: [ios, android] }
                provider: { type: string }
                token: { type: string }
                device_name: { type: string, nullable: true }
      responses:
        "200":
          description: OK

  /me/push-devices/{uuid}:
    delete:
      tags: [Me]
      summary: Elimina un dispositivo push propio
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Sanctum de un `User`
    deviceBearerAuth:
      type: http
      scheme: bearer
      description: Token Sanctum de un `ProductionDevice` — nunca intercambiable con un token de `User`

  parameters:
    EventEditionId:
      name: eventEdition
      in: path
      required: true
      schema: { type: integer }
    EventParticipantId:
      name: eventParticipant
      in: path
      required: true
      schema: { type: integer }

  responses:
    Unauthenticated:
      description: Token ausente o inválido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Autenticado pero sin permiso
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string }
            details: { type: object }
        request_id: { type: string, nullable: true }

    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    ProductVariant:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        attributes: { type: object, additionalProperties: true, nullable: true }
        base_price_minor: { type: integer }
        currency: { type: string, example: MXN }
        active: { type: boolean }
        in_stock: { type: boolean, description: "Nunca expone el conteo exacto de stock" }

    ProductSummary:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        type: { type: string, enum: [legacy_plate, apparel, accessory, equipment] }
        brand: { type: string }
        category: { type: string, nullable: true }
        from_price_minor: { type: integer, nullable: true }
        currency: { type: string }

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          properties:
            description: { type: string, nullable: true }
            qr_capable: { type: boolean }
            requires_shipping: { type: boolean }
            variants:
              type: array
              items: { $ref: "#/components/schemas/ProductVariant" }

    Cart:
      type: object
      description: >
        Prices are always resolved via App\Actions\Commerce\
        ResolveProductPrice (App\Queries\Commerce\GetCartSummary) — the
        same source of truth CheckoutCart charges from, never a raw
        ProductVariant.base_price_minor.
      properties:
        uuid: { type: string, format: uuid }
        currency: { type: string }
        subtotal_minor: { type: integer }
        discount_minor: { type: integer }
        total_minor: { type: integer }
        coupon:
          type: object
          nullable: true
          properties:
            code: { type: string }
            name: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              quantity: { type: integer }
              product_name: { type: string }
              product_slug: { type: string, nullable: true }
              variant_name: { type: string }
              unit_price_minor: { type: integer, nullable: true }
              line_total_minor: { type: integer, nullable: true }
              currency: { type: string }
              price_type: { type: string, nullable: true }
              price_available:
                type: boolean
                description: false if the line's price schedule no longer applies (e.g. a presale window closed) since it was added
              in_stock: { type: boolean }
              image_url: { type: string, nullable: true }
              event_edition_name: { type: string, nullable: true }

    OrderItem:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        sku: { type: string }
        quantity: { type: integer }
        unit_price_minor: { type: integer }
        line_total_minor: { type: integer }
        currency: { type: string }
        fulfilled: { type: boolean }

    Order:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        order_number: { type: string, example: FL-XXXXXXXX }
        status: { type: string, enum: [pending, confirmed, cancelled, completed] }
        payment_status: { type: string, enum: [pending, authorized, paid, failed, refunded, partially_refunded, cancelled] }
        fulfillment_status: { type: string, enum: [unfulfilled, partially_fulfilled, fulfilled, cancelled] }
        subtotal_minor: { type: integer }
        discount_minor: { type: integer }
        tax_minor: { type: integer }
        total_minor: { type: integer }
        currency: { type: string }
        created_at: { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }

    User:
      type: object
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        email_verified: { type: boolean }
        legacy_id: { type: string, nullable: true }
        athlete:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            full_name: { type: string }
        permissions:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }

    ParticipantSummary:
      type: object
      properties:
        id: { type: integer }
        bib_number: { type: string, nullable: true }
        full_name: { type: string }
        race: { type: string, nullable: true }
        has_result: { type: boolean }
        has_plate: { type: boolean }

    Split:
      type: object
      properties:
        label: { type: string }
        sequence: { type: integer }
        elapsed_time: { type: string, nullable: true }
        segment_time: { type: string, nullable: true }

    Result:
      type: object
      nullable: true
      properties:
        official_time: { type: string, nullable: true }
        pace: { type: string, nullable: true }
        status: { type: string }
        overall_position: { type: integer, nullable: true }
        category_position: { type: integer, nullable: true }
        manual_override: { type: boolean }
        splits:
          type: array
          items: { $ref: "#/components/schemas/Split" }

    ParticipantDetail:
      type: object
      properties:
        id: { type: integer }
        bib_number: { type: string, nullable: true }
        full_name: { type: string }
        gender: { type: string, nullable: true }
        category: { type: string, nullable: true }
        race: { type: string, nullable: true }
        athlete:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            full_name: { type: string }
            previous_participations_count: { type: integer }
        result: { $ref: "#/components/schemas/Result" }
        template_name: { type: string, nullable: true }
        plate:
          allOf:
            - { $ref: "#/components/schemas/Plate" }
          nullable: true
        eligibility:
          type: object
          properties:
            eligible: { type: boolean }
            reasons:
              type: array
              items: { type: string, enum: [NO_RESULT, NO_TEMPLATE, IDENTITY_CONFLICT, PLATE_ALREADY_EXISTS] }

    Plate:
      type: object
      properties:
        id: { type: integer }
        serial_number: { type: string }
        status: { type: string }
        legacy_code: { type: string, nullable: true }
        template_version_id: { type: integer, nullable: true }
        production_job:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            status: { type: string }
            next_action: { type: string, nullable: true }

    Device:
      type: object
      properties:
        uuid: { type: string }
        name: { type: string }
        station_code: { type: string, nullable: true }
        status: { type: string }
        online: { type: boolean }
        last_seen_at: { type: string, format: date-time, nullable: true }
        app_version: { type: string, nullable: true }
        machine_profile:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }
        event_edition:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string }

    SyncRun:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, running, completed, partial, failed] }
        sync_type: { type: string, enum: [roster, results, full] }
        provider: { type: string }
        event: { type: string, nullable: true }
        edition: { type: string, nullable: true }
        started_at: { type: string, nullable: true }
        completed_at: { type: string, nullable: true }
        events_received: { type: integer }
        participants_received: { type: integer }
        participants_created: { type: integer }
        participants_updated: { type: integer }
        results_received: { type: integer }
        results_created: { type: integer }
        results_updated: { type: integer }
        splits_received: { type: integer }
        identity_conflicts: { type: integer }
        errors_count: { type: integer }
